name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queueup
          POSTGRES_PASSWORD: queueup
          POSTGRES_DB: queueup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queueup" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://queueup:queueup@localhost:5432/queueup_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Raise Postgres connection limit for the 100-way race test
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U queueup -c "ALTER SYSTEM SET max_connections = 200"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U queueup; do sleep 1; done
      - name: Tests (including the concurrency proof)
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
